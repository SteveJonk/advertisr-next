name: Build App Image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/build-app-image.yml"
  workflow_dispatch:

# Image-naam is standaard de repo-naam; zet repo-variable IMAGE_NAME om te
# overriden.
env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.event.repository.name }}

# Eén run tegelijk. Niet annuleren: een afgebroken deploy laat anders twee
# app-containers achter. Een nieuwe push wacht tot de lopende klaar is.
concurrency:
  group: build-app-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker-image-namen moeten lowercase zijn; github.repository_owner is
      # dat niet altijd (bv. "SteveJonk").
      - name: Lowercase image naam
        id: image
        run: echo "name=ghcr.io/${OWNER,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      # NEXT_PUBLIC_* worden in de client-bundle gebakken, dus die moeten bij
      # het bouwen bekend zijn — geen geheimen, dus gewoon als build-arg.
      # SENTRY_AUTH_TOKEN gaat via --secret (BuildKit), zodat hij niet in de
      # image-laag-historie belandt. Alle Sentry-waardes zijn optioneel: zonder
      # NEXT_PUBLIC_SENTRY_DSN bouwt de app zonder Sentry.
      - name: Build en push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SANITY_API_VERSION=${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID=${{ vars.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
            NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Kopieert deploy/compose.yml naar de server en start de nieuwe image. Eerst
  # pullen, dan pas vervangen: de onderbreking is alleen de herstart (~1-3s).
  # De GHCR-package is public, dus geen docker login nodig.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_DIR: advertisr
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      # SSH_KNOWN_HOSTS (output van `ssh-keyscan <host>`) pint de host key,
      # zodat een gespoofte server de sleutel niet kan onderscheppen.
      - name: SSH klaarzetten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n' \
            "$SSH_HOST" "$SSH_USER" "${SSH_PORT:-22}" > ~/.ssh/config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}

      - name: Deploy-bestanden kopiëren
        run: |
          ssh server "mkdir -p $DEPLOY_DIR"
          scp deploy/compose.yml "server:$DEPLOY_DIR/"

      - name: Nieuwe versie uitrollen
        run: |
          ssh server "cd $DEPLOY_DIR && echo APP_IMAGE=$IMAGE > .env \
            && docker compose pull && docker compose up -d --wait \
            && docker image prune -f"
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
